<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src https://dkhtjkcygbpomaummdih.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Choose a new password — NearBuddy</title>
  <meta name="description" content="Choose a new password for your NearBuddy account.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20fill%3D%22%23F6D08A%22%20d%3D%22M12%2021.35l-1.45-1.32C5.4%2015.36%202%2012.28%202%208.5%202%205.42%204.42%203%207.5%203c1.74%200%203.41%200.81%204.5%202.09C13.09%203.81%2014.76%203%2016.5%203%2019.58%203%2022%205.42%2022%208.5c0%203.78-3.4%206.86-8.55%2011.54L12%2021.35z%22%2F%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="reset.css">
</head>
<body>
  <header class="site-header"><div class="container"><nav class="nav" aria-label="Primary">
    <a class="brand" href="/"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F6D08A" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>NearBuddy</span></a>
  </nav></div></header>
  <main class="reset-main">
    <section class="reset-card" aria-labelledby="reset-heading">
      <p class="eyebrow-mini">Account recovery</p>
      <h1 id="reset-heading">Choose a new password</h1>
      <p id="reset-detail" class="reset-detail">Use at least 6 characters. This link can be used only once and expires after its security window.</p>
      <form id="reset-form" novalidate>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
        <p id="reset-status" class="reset-status" role="status" aria-live="polite"></p>
        <button id="reset-submit" class="btn btn-action btn-lg" type="submit">Change password</button>
      </form>
      <a class="reset-home" href="/">Return to NearBuddy</a>
    </section>
  </main>
  <script src="reset.js" defer></script>
</body>
</html>
